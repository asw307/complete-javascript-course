name: Deploy sites to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "site-hub/**"
      - "tools-website/**"
      - "jewellery-store/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p dist
          cp site-hub/index.html dist/
          cp -r tools-website dist/tools-website
          cp -r jewellery-store dist/jewellery-store

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
