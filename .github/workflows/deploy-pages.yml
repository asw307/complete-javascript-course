name: Deploy sites to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "jewellery-store/**"
      - "analytics-tools/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # jewellery-store serves from the site root; analytics-tools from /analytics-tools/.
      # To swap which one is at the root, change these two copy lines.
      - name: Assemble site
        run: |
          mkdir -p dist
          cp -r jewellery-store/. dist/
          cp -r analytics-tools dist/analytics-tools
          echo "--- dist tree ---"
          find dist -maxdepth 2 | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
