<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Hub</title>
    <style>
      :root {
        --bg: #0f1115;
        --card-bg: #1a1d24;
        --text: #f0f2f5;
        --muted: #9aa1ac;
        --accent: #ffb545;
        --border: #2a2e37;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        min-height: 100vh;
      }
      main {
        max-width: 44rem;
        margin: 0 auto;
        padding: 2rem 1.5rem;
        text-align: center;
      }
      h1 {
        font-size: 2rem;
        margin: 0 0 2rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
        gap: 1.25rem;
      }
      .card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 2rem 1.5rem;
        text-decoration: none;
        color: inherit;
        transition: transform 0.15s ease, border-color 0.15s ease;
      }
      .card:hover {
        transform: translateY(-3px);
        border-color: var(--accent);
      }
      .card .emoji {
        font-size: 2.2rem;
        display: block;
        margin-bottom: 0.75rem;
      }
      .card h2 {
        margin: 0 0 0.4rem;
        font-size: 1.2rem;
      }
      .card p {
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f7f7f9;
          --card-bg: #ffffff;
          --text: #16181d;
          --muted: #5b6270;
          --border: #e4e6ea;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Project Hub</h1>
      <div class="grid">
        <a class="card" href="tools-website/index.html">
          <span class="emoji">🛠️</span>
          <h2>JS Tools Hub</h2>
          <p>Mini apps from the Complete JavaScript Course</p>
        </a>
        <a class="card" href="jewellery-store/index.html">
          <span class="emoji">💍</span>
          <h2>Aurelia Jewellery</h2>
          <p>A demo jewellery storefront with cart &amp; checkout</p>
        </a>
      </div>
    </main>
  </body>
</html>
